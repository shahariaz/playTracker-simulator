simulation:
  start_date: "2024-01-01T00:00:00Z"
  end_date: "2025-11-30T23:59:59Z"

content:
  series:
    count: 500
    episodes_per_series_min: 80
    episodes_per_series_max: 120
    seasons_per_series_min: 3
    seasons_per_series_max: 10
  movies:
    count: 10000

users:
  total_count: 1000
  batch_size: 1000
  
  distribution:
    light_users: 0.65    # 10-20 videos
    medium_users: 0.25   # 20-30 videos
    heavy_users: 0.10    # 30-40 videos
  
  activity_patterns:
    churned: 0.20        # Stopped watching
    active: 0.50         # Consistent viewers
    new: 0.20            # Joined in 2025
    sporadic: 0.10       # Irregular patterns

  demographics:
    countries:
      - code: "BD"
        weight: 0.70
        cities: ["Dhaka", "Chittagong", "Sylhet", "Khulna", "Rajshahi", "Barisal", "Rangpur", "Comilla", "Gazipur", "Narayanganj", "Mymensingh", "Bogra", "Jessore"]
      - code: "IN"
        weight: 0.12
        cities: ["Kolkata", "Mumbai", "Delhi", "Chennai", "Bangalore"]
      - code: "PK"
        weight: 0.08
        cities: ["Karachi", "Lahore", "Islamabad", "Faisalabad", "Rawalpindi"]
      - code: "UK"
        weight: 0.04
        cities: ["London", "Manchester", "Birmingham", "Bradford", "Leicester"]
      - code: "US"
        weight: 0.03
        cities: ["New York", "Los Angeles", "Detroit", "Chicago", "Boston"]
      - code: "CA"
        weight: 0.02
        cities: ["Toronto", "Montreal", "Vancouver", "Calgary", "Ottawa"]
      - code: "AU"
        weight: 0.01
        cities: ["Sydney", "Melbourne", "Brisbane", "Perth", "Adelaide"]

watch_history:
  # Video count ranges for different user tiers
  video_counts:
    light_users:
      min: 5
      max: 10
    medium_users:
      min: 10
      max: 15
    heavy_users:
      min: 15
      max: 20
  
  # Generation settings
  batch_size: 1000             # Number of users per batch file
  worker_count: 10             # Concurrent workers per batch
  progress_bar_width: 30       # Progress bar display width
  
  # Behavioral probabilities
  binge_probability: 0.40      # Chance to continue watching current series
  series_probability: 0.25     # Chance to select series vs other content

genres:
  - Drama
  - Romance
  - Comedy
  - Family
  - Social
  - Historical
  - Musical
  - Folk
  - Action
  - Thriller
  - Biography
  - Documentary
  - Cultural
  - Traditional
  - Contemporary
  - Political
  - Liberation War
  - Village Life
  - Urban Life
  - Religious

api:
  harbor_url: "http://localhost:8081"
  workers: 20
  batch_size: 500
  rate_limit_per_second: 100
  timeout_seconds: 30

