simulation:
  start_date: "2024-01-01T00:00:00Z"
  end_date: "2025-11-30T23:59:59Z"

content:
  series:
    count: 500
    episodes_per_series_min: 80
    episodes_per_series_max: 120
    seasons_per_series_min: 3
    seasons_per_series_max: 10
  movies:
    count: 10000

users:
  total_count: 30
  batch_size: 100000
  
  distribution:
    light_users: 0.65    # 10-20 videos
    medium_users: 0.25   # 20-30 videos
    heavy_users: 0.10    # 30-40 videos
  
  activity_patterns:
    churned: 0.20        # Stopped watching
    active: 0.50         # Consistent viewers
    new: 0.20            # Joined in 2025
    sporadic: 0.10       # Irregular patterns

  demographics:
    countries:
      - code: "US"
        weight: 0.35
        cities: ["New York", "Los Angeles", "Chicago", "Houston", "Phoenix"]
      - code: "IN"
        weight: 0.20
        cities: ["Mumbai", "Delhi", "Bangalore", "Hyderabad", "Chennai"]
      - code: "UK"
        weight: 0.10
        cities: ["London", "Manchester", "Birmingham", "Leeds", "Glasgow"]
      - code: "CA"
        weight: 0.08
        cities: ["Toronto", "Montreal", "Vancouver", "Calgary", "Ottawa"]
      - code: "AU"
        weight: 0.05
        cities: ["Sydney", "Melbourne", "Brisbane", "Perth", "Adelaide"]

genres:
  - Action
  - Comedy
  - Drama
  - Thriller
  - Romance
  - Sci-Fi
  - Horror
  - Documentary
  - Animation
  - Crime
  - Fantasy
  - Mystery

api:
  harbor_url: "http://localhost:8081"
  workers: 20
  batch_size: 500
  rate_limit_per_second: 100
  timeout_seconds: 30

rabbitmq:
  user: "admin"
  password: "admin123"
  host: "localhost"
  port: 5672
  vhost: "/"
  watch_history_queue: "watchhi-story"
  content_item_queue: "content_item"
  series_item_queue: "series_item"

output:
  content_dir: "data/content"
  users_dir: "data/users"
  watch_history_dir: "data/watch_history"
